# Dependabot — remplace Renovate (renovate.json supprimé).
#
# Politique (reprise de la config Renovate) :
#   - majeurs : jamais groupés → une PR par paquet, migration manuelle.
#   - mineurs pré-1.0 des dépendances directes : ignorés (0.x → 0.y est cassant).
#   - grammers-client / grammers-session : exclus (migration différée).
#   - non-majeurs : groupés par écosystème pour limiter le nombre de PR.
#
# ⚠️ Dependabot n'évalue jamais `versions` ET `update-types` dans une même règle
# `ignore` : les deux critères deviennent deux conditions distinctes (donc « OU »
# et non « ET »). Impossible d'écrire « ignorer les mineurs sous 1.0 » en une
# règle → les dépendances directes pré-1.0 sont listées explicitement. Ajouter
# ici toute nouvelle dépendance directe en 0.x.
#
# Les Dependabot alerts et security updates sont activés côté repo ; les PR de
# sécurité ne tiennent pas compte des règles `ignore` ci-dessous.
version: 2
updates:
  # ---------------------------------------------------------------- Rust
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      rust-non-major:
        patterns: ["*"]
        exclude-patterns: ["grammers-client", "grammers-session"]
        update-types: ["minor", "patch"]
    ignore:
      # Migration différée : réécriture de l'API client/session + souci upstream.
      - dependency-name: "grammers-client"
      - dependency-name: "grammers-session"
      # Dépendances directes pré-1.0 (workspace + membres) : un mineur 0.x → 0.y
      # casse l'API et impose une édition du manifeste. Les patchs pré-1.0
      # restent proposés (groupés).
      - dependency-name: "argon2"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "async-stream"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "async-trait"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "axum"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "base64"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "chrono"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "futures"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "image"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "jpeg-decoder"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "lopdf"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "lru"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "pdfium-render"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "rand"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "reqwest"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "scraper"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "sha2"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "sqlx"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "tokio-stream"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "tokio-util"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "tower"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "tower-http"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "tracing"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "tracing-subscriber"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "unrar"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "webp"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "wiremock"
        update-types: ["version-update:semver-minor"]

  # ------------------------------------------------------ Backoffice (npm)
  - package-ecosystem: "npm"
    directory: "/apps/backoffice"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      backoffice-non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Pré-1.0 : 0.x → 0.y est cassant (voir note en tête de fichier).
      - dependency-name: "next-themes"
        update-types: ["version-update:semver-minor"]

  # ---------------------------------------------------------- Docs (npm)
  - package-ecosystem: "npm"
    directory: "/apps/docs"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      docs-non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Pré-1.0 : 0.x → 0.y est cassant (voir note en tête de fichier).
      - dependency-name: "@astrojs/starlight"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "sharp"
        update-types: ["version-update:semver-minor"]

  # -------------------------------------------------- Racine du repo (npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      root-non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # -------------------------------------------------------- GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 3
    groups:
      ci-non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --------------------------------------------- Dockerfiles (images FROM)
  - package-ecosystem: "docker"
    directories:
      - "/apps/api"
      - "/apps/backoffice"
      - "/apps/docs"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
    groups:
      docker-images:
        patterns: ["*"]

  # -------------------------------------------- docker-compose (services)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
    groups:
      compose-images:
        patterns: ["*"]
