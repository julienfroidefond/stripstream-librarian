name: Dependabot auto-merge

# Merges Dependabot pull requests that match the update policy
# (.github/dependabot-policy.md): patch and minor bumps only, and never a
# `0.x -> 0.y` bump (breaking by Cargo/npm convention, treated as a major).
# Majors always stay open for manual review.
#
# Why not GitHub's native auto-merge (`gh pr merge --auto`)? The underlying
# GraphQL mutation `enablePullRequestAutoMerge` answers "Resource not
# accessible by personal access token" for fine-grained PATs, even with
# Contents/Pull requests write on the repository (verified on this repo). The
# workflow therefore does the waiting itself: it polls the three required
# checks of the "Protect main" ruleset and merges once they are all green.
#
# Why `pull_request_target` and not `pull_request`: it runs the workflow from
# the BASE branch, so the file does not have to exist in the Dependabot branch,
# the token is writable, and above all no code from the PR is checked out or
# executed. The job is restricted to `dependabot[bot]`.
#
# Why a PAT (`AUTOMERGE_TOKEN`) instead of `GITHUB_TOKEN`: a merge performed
# with the repository token does not trigger `push` workflows, so `deploy.yml`
# (version bump, image build, deploy) would never run and `main` would move
# ahead without being deployed. With the PAT the merge is attributed to its
# owner, exactly like a human merge.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

# One evaluation per PR; a new push supersedes the previous one.
concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # The poll loop below gives up after 60 minutes; keep some margin.
    timeout-minutes: 70
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ github.token }}

      # One decision for the whole PR: Dependabot groups several bumps into a
      # single PR, so every bumped dependency must qualify. `prevVersion` is
      # empty for grouped PRs, hence the `dependencyGroup` fallback: groups are
      # configured as minor+patch only, with pre-1.0 dependencies excluded from
      # them (see `.github/dependabot.yml`).
      - name: Check the update policy
        id: policy
        env:
          DEPENDENCIES: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail
          eligible=$(jq -r '
            all(.[];
              if .updateType == "version-update:semver-major" then false
              elif .updateType == "version-update:semver-patch" then true
              elif ((.prevVersion // "") | test("^0\\.")) then false
              elif .updateType == "version-update:semver-minor" then
                ((.prevVersion // "") != "") or ((.dependencyGroup // "") != "")
              else false end)
          ' <<<"$DEPENDENCIES")
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      - name: Merge once the required checks are green
        if: steps.policy.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::the AUTOMERGE_TOKEN secret is missing. Create a fine-grained PAT (Contents: write, Pull requests: write) and add it as a repository secret, otherwise a merge would not trigger deploy.yml."
            exit 1
          fi

          # Required checks of the "Protect main" ruleset (.github/workflows/README.md).
          required='["Rust (fmt · clippy · test)","Backoffice (tsc · lint · tests)","Docs (build)"]'

          for attempt in $(seq 1 120); do
            rollup=$(gh pr view "$PR_URL" --json statusCheckRollup)
            verdict=$(jq -r --argjson required "$required" '
              [ $required[] as $name
                | ([.statusCheckRollup[] | select(.name == $name)] | last) as $check
                | if $check == null then "pending"
                  elif (["SUCCESS", "SKIPPED", "NEUTRAL"] | index($check.conclusion // "")) then "ok"
                  elif (["FAILURE", "CANCELLED", "TIMED_OUT", "ACTION_REQUIRED", "STARTUP_FAILURE"] | index($check.conclusion // "")) then "failed"
                  else "pending" end
              ] as $states
              | if ($states | index("failed")) then "failed"
                elif ($states | all(. == "ok")) then "ready"
                else "pending" end
            ' <<<"$rollup")

            echo "attempt ${attempt}: ${verdict} (${required})"
            case "$verdict" in
              ready)
                # The "Protect main" ruleset sets
                # `require_extra_approval_for_unattributed_changes`: a bot push
                # stays BLOCKED until one approval exists, even with zero
                # required reviews. This is that approval, and it is only given
                # once the three required checks are green.
                gh pr review --approve "$PR_URL" \
                  --body "CI verte (Rust, Backoffice, Docs) : merge automatique." \
                  || echo "already approved, continuing"

                # GitHub recomputes mergeability asynchronously: right after the
                # approval the PR still reports BLOCKED for ~20s, and
                # `gh pr merge` pre-checks that value.
                for _ in $(seq 1 20); do
                  merge_state=$(gh pr view "$PR_URL" --json mergeStateStatus -q .mergeStateStatus)
                  if [ "$merge_state" != "BLOCKED" ] && [ "$merge_state" != "UNKNOWN" ]; then
                    break
                  fi
                  sleep 6
                done

                for attempt in 1 2 3; do
                  if gh pr merge --squash --delete-branch "$PR_URL"; then
                    exit 0
                  fi
                  echo "merge attempt ${attempt} failed, retrying in 15s"
                  sleep 15
                done
                echo "::error::could not merge the pull request"
                exit 1
                ;;
              failed)
                echo "::error::a required check failed, not merging"
                exit 1
                ;;
            esac
            sleep 30
          done

          echo "::error::required checks still not green after 60 minutes, giving up"
          exit 1

      - name: Report decision
        if: steps.policy.outputs.eligible != 'true'
        run: |
          echo "::notice::not auto-merged: major or 0.x minor bump, manual review required"
