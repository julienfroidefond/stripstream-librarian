name: Build & Push

# Builds and pushes the Docker images on GitHub-hosted runners, then deploys
# them on the Mac mini through the self-hosted runner (job `deploy`).
#
# This replaces the former Gitea pipeline (.gitea/workflows/deploy.yml):
# GitHub is now the single deployment path.

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: docker.io
  OWNER: julienfroidefond32
  PLATFORMS: linux/amd64

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detect.outputs.api }}
      backoffice: ${{ steps.detect.outputs.backoffice }}
      docs: ${{ steps.detect.outputs.docs }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Keep the parent commit available for the changed-files detection below.
          fetch-depth: 2

      - name: Detect changes & resolve version
        id: detect
        run: |
          set -euo pipefail
          v=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Detected version: $v"

          # On a manual run, the first push, or a force-push there is no parent
          # commit — rebuild everything in that case.
          build_all=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || ! git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            build_all=true
          fi

          if [ "$build_all" = true ]; then
            changed="ALL FILES"
          else
            changed=$(git diff --name-only HEAD~1 HEAD)
          fi
          echo "Changed files:"
          echo "$changed"

          has() {
            [ "$build_all" = true ] && return 0
            echo "$changed" | grep -qE "$1"
          }

          if has "^(apps/api/|apps/indexer/|crates/|Cargo\.toml|Cargo\.lock|infra/migrations/)"; then
            build_api=true
          else
            build_api=false
          fi
          if has "^apps/backoffice/"; then
            changed_backoffice=true
          else
            changed_backoffice=false
          fi
          if [ "$build_all" = true ]; then
            build_backoffice=true
          else
            # Test/config-only changes run the backoffice checks but must not
            # rebuild the production image.
            bo_build=$(echo "$changed" | grep -E "^apps/backoffice/" \
              | grep -vE "(^apps/backoffice/tests/|\.test\.(ts|tsx)$|^apps/backoffice/playwright\.config\.|^apps/backoffice/vitest\.config\.|^apps/backoffice/eslint\.config\.)" \
              || true)
            if [ -n "$bo_build" ]; then build_backoffice=true; else build_backoffice=false; fi
          fi
          if has "^apps/docs/"; then
            build_docs=true
          else
            build_docs=false
          fi

          # Consumed by the later build steps through the step environment...
          {
            echo "BUILD_API=$build_api"
            echo "CHANGED_BACKOFFICE=$changed_backoffice"
            echo "BUILD_BACKOFFICE=$build_backoffice"
            echo "BUILD_DOCS=$build_docs"
          } >> "$GITHUB_ENV"

          # ...and by the `deploy` job through job outputs.
          {
            echo "api=$build_api"
            echo "backoffice=$build_backoffice"
            echo "docs=$build_docs"
          } >> "$GITHUB_OUTPUT"

          if [ "$build_api" = true ]; then echo "api → build"; fi
          if [ "$build_backoffice" = true ]; then echo "backoffice → build"; fi
          if [ "$build_docs" = true ]; then echo "docs → build"; fi

          if [ "$build_api" = true ] || [ "$build_backoffice" = true ] || [ "$build_docs" = true ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "No image to build — deploy will be skipped."
          fi

      - name: Set up Node
        if: env.CHANGED_BACKOFFICE == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backoffice/package-lock.json

      - name: Backoffice checks
        if: env.CHANGED_BACKOFFICE == 'true'
        working-directory: apps/backoffice
        run: |
          set -e
          npm ci
          npx tsc --noEmit
          npm run lint
          npm run test:unit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # api and indexer share apps/api/Dockerfile via stage targets — the
      # heavy `builder` stage is compiled once for api, then reused from cache
      # when indexer builds (only its small final stage runs).
      - name: Build & push api
        if: env.BUILD_API == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: api
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-api:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-api:${{ env.VERSION }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-api:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-api:buildcache,mode=max

      - name: Build & push indexer
        if: env.BUILD_API == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: indexer
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-indexer:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-indexer:${{ env.VERSION }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-indexer:buildcache
            type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-api:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-indexer:buildcache,mode=max

      - name: Build & push backoffice
        if: env.BUILD_BACKOFFICE == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backoffice/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-backoffice:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-backoffice:${{ env.VERSION }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-backoffice:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-backoffice:buildcache,mode=max

      - name: Build & push docs
        if: env.BUILD_DOCS == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docs/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-docs:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-docs:${{ env.VERSION }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-docs:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-docs:buildcache,mode=max

  # Runs on the Mac mini (self-hosted runner, OrbStack). Pulls the images that
  # were just pushed and restarts the stripstream stack from the local
  # docker-stack checkout. The images are public, so no registry login is
  # needed here.
  #
  # Guarded on the repository so a fork can never reach the self-hosted runner,
  # and only reachable from a push to main (the workflow has no pull_request
  # trigger).
  deploy:
    name: Deploy to Mac mini
    needs: build-and-push
    if: >-
      needs.build-and-push.outputs.any == 'true' &&
      github.repository == 'julienfroidefond/stripstream-librarian'
    runs-on: [self-hosted, mac-mini]
    steps:
      - name: Pull images & restart stack
        env:
          DEPLOY_API: ${{ needs.build-and-push.outputs.api }}
          DEPLOY_BACKOFFICE: ${{ needs.build-and-push.outputs.backoffice }}
          DEPLOY_DOCS: ${{ needs.build-and-push.outputs.docs }}
        run: |
          set -euo pipefail
          # The runner runs in a non-interactive launchd session, so the macOS
          # login keychain is locked and Docker's `osxkeychain` credential
          # helper makes every `docker pull` fail. The images are public, so
          # point Docker at a throwaway config that has no credential helper.
          export DOCKER_CONFIG="$(mktemp -d)"
          cd /Users/julienfroidefond/Sites/docker-stack

          svcs=""
          if [ "$DEPLOY_API" = "true" ]; then svcs="$svcs api indexer"; fi
          if [ "$DEPLOY_BACKOFFICE" = "true" ]; then svcs="$svcs backoffice"; fi
          if [ "$DEPLOY_DOCS" = "true" ]; then svcs="$svcs docs"; fi

          for svc in $svcs; do
            echo "Pulling julienfroidefond32/stripstream-$svc:latest"
            docker pull "julienfroidefond32/stripstream-$svc:latest"
          done

          BUILDKIT_PROGRESS=plain ./scripts/stack.sh up stripstream
