name: Build, Push & Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: docker.io
  OWNER: julienfroidefond32
  PLATFORMS: linux/amd64

jobs:
  build:
    runs-on: mac-orbstack-runner
    strategy:
      matrix:
        service: [api, indexer, backoffice, docs]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-${{ matrix.service }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-${{ matrix.service }}:buildcache,mode=max

  deploy:
    needs: build
    runs-on: mac-orbstack-runner
    steps:
      - name: Pull images and restart stack
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: |
          set -e
          cd /Users/julienfroidefond/Sites/docker-stack
          for svc in backoffice api indexer docs; do
            docker pull julienfroidefond32/stripstream-$svc:latest
          done
          BUILDKIT_PROGRESS=plain ./scripts/stack.sh up stripstream

      - name: Cleanup old images
        run: docker image prune -f
