name: CI (web)

# Node validation for the two web apps, on pull requests only.
#
# On push to main the backoffice checks already run inside the deploy pipeline
# (.github/workflows/deploy.yml) before the image is built, so this workflow
# deliberately does not duplicate them — it only fills the PR gap, where
# nothing validated the web apps before.
#
# Triggered only by changes under apps/backoffice/ or apps/docs/; the per-app
# jobs are further gated so a docs-only PR does not run the backoffice suite.

on:
  pull_request:
    paths:
      - "apps/backoffice/**"
      - "apps/docs/**"

# dorny/paths-filter lists the PR's changed files through the API.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backoffice: ${{ steps.filter.outputs.backoffice }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backoffice:
              - "apps/backoffice/**"
            docs:
              - "apps/docs/**"

  backoffice:
    name: Backoffice (tsc · lint · tests)
    needs: changes
    if: needs.changes.outputs.backoffice == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backoffice
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backoffice/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit

  docs:
    name: Docs (build)
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
