name: Security scan

# Scans the published images — the exact digests deployed on the Mac mini —
# with Trivy, once a week and on demand. Only *fixable* CRITICAL/HIGH findings
# fail the job: Debian/Alpine packages flagged without a fixed version cannot be
# acted on until the base image is rebuilt upstream, and blocking on them would
# make the check permanently red (see the API image, which carries ~40 of them).
#
# This is a drift detector, not a PR gate: it is deliberately absent from the
# required checks and does not rebuild anything. When it turns red, either
# rebuild the affected image (`workflow_dispatch` on deploy.yml) or bump the
# base image / fix the dependency it points at.

on:
  schedule:
    # Monday 05:00 UTC, before the working week.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, indexer, backoffice, docs]
    steps:
      - name: Scan julienfroidefond32/stripstream-${{ matrix.image }}:latest
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker.io/julienfroidefond32/stripstream-${{ matrix.image }}:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
