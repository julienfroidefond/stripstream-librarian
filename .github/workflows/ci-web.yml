name: CI (web)

# Node validation for the two web apps, on pull requests only.
#
# On push to main the backoffice checks already run inside the deploy pipeline
# (.github/workflows/deploy.yml) before the image is built, so this workflow
# deliberately does not duplicate them — it only fills the PR gap, where
# nothing validated the web apps before.
#
# Triggered on every pull request, deliberately without a `paths` filter: both
# job names below are required status checks on the protected branch, and a
# workflow that does not trigger at all leaves those checks "Expected", which
# would block every Rust-only PR forever. The per-app jobs are gated by the
# `changes` filter instead — a job skipped by `if:` still reports a successful
# required check.

on:
  pull_request:

# dorny/paths-filter lists the PR's changed files through the API.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backoffice: ${{ steps.filter.outputs.backoffice }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backoffice:
              - "apps/backoffice/**"
            docs:
              - "apps/docs/**"

  backoffice:
    name: Backoffice (tsc · lint · tests)
    needs: changes
    if: needs.changes.outputs.backoffice == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backoffice
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/backoffice/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate route types
        run: npx next typegen
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit

  docs:
    name: Docs (build)
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
