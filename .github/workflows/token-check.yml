name: token check

# Throwaway workflow: inspects what the AUTOMERGE_TOKEN can actually do.
on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect token
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          echo "token owner : $(gh api user -q .login)"
          echo "permissions : $(gh api "repos/$REPO" -q '.permissions | tojson')"
          echo "scopes      : $(curl -sI -H "Authorization: token $GH_TOKEN" https://api.github.com | tr -d '\r' | grep -i '^x-oauth-scopes' || echo '(fine-grained, no scopes header)')"
          echo "--- enable auto-merge on #164:"
          gh pr merge --auto --squash "https://github.com/$REPO/pull/164" && echo "RESULT: OK" || echo "RESULT: FAILED"
