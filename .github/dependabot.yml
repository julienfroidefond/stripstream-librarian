# Dependabot — remplace Renovate (renovate.json supprimé).
#
# Politique (reprise de la config Renovate, sans Dependency Dashboard) :
#   - majeurs : jamais groupés → une PR par paquet, traitement manuel.
#   - mineurs pré-1.0 des dépendances directes : hors groupe eux aussi → une PR
#     individuelle (donc visible) par bump 0.x → 0.y, jamais noyée dans un lot.
#   - grammers-client / grammers-session : aucune PR (migration différée).
#   - autres non-majeurs : groupés par écosystème pour limiter le nombre de PR.
#
# ⚠️ Dependabot n'a pas de Dependency Dashboard : ce qui n'est ni groupé ni mis en
# PR est invisible. D'où le choix de ne rien `ignore` en dehors de grammers et
# d'isoler les bumps cassants en PR individuelles plutôt que de les masquer.
#
# Les dépendances directes en 0.x sont listées dans `exclude-patterns` : penser à
# ajouter toute nouvelle dépendance directe pré-1.0 à ces listes.
#
# Les Dependabot alerts et security updates sont activés côté repo.
version: 2
updates:
  # ---------------------------------------------------------------- Rust
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      rust-non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]
        exclude-patterns:
          # Migration différée : ne doit jamais être embarqué dans un lot.
          - "grammers-client"
          - "grammers-session"
          # Dépendances directes pré-1.0 (workspace + membres) : un mineur
          # 0.x → 0.y casse l'API (Cargo traite le mineur d'une 0.x comme un
          # majeur). Hors groupe → une PR dédiée, à traiter manuellement.
          - "argon2"
          - "async-stream"
          - "async-trait"
          - "axum"
          - "base64"
          - "chrono"
          - "futures"
          - "image"
          - "jpeg-decoder"
          - "lopdf"
          - "lru"
          - "pdfium-render"
          - "rand"
          - "reqwest"
          - "scraper"
          - "sha2"
          - "sqlx"
          - "tokio-stream"
          - "tokio-util"
          - "tower"
          - "tower-http"
          - "tracing"
          - "tracing-subscriber"
          - "unrar"
          - "webp"
          - "wiremock"
    ignore:
      # Migration différée : réécriture de l'API client/session + souci upstream.
      - dependency-name: "grammers-client"
      - dependency-name: "grammers-session"

  # ------------------------------------------------------ Backoffice (npm)
  - package-ecosystem: "npm"
    directory: "/apps/backoffice"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      backoffice-non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]
        exclude-patterns:
          # Pré-1.0 : hors groupe, un 0.x → 0.y est cassant (voir en-tête).
          - "next-themes"

  # ---------------------------------------------------------- Docs (npm)
  - package-ecosystem: "npm"
    directory: "/apps/docs"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      docs-non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]
        exclude-patterns:
          # Pré-1.0 : hors groupe, un 0.x → 0.y est cassant (voir en-tête).
          - "@astrojs/starlight"
          - "sharp"

  # -------------------------------------------------- Racine du repo (npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      root-non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # -------------------------------------------------------- GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 3
    groups:
      ci-non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --------------------------------------------- Dockerfiles (images FROM)
  - package-ecosystem: "docker"
    directories:
      - "/apps/api"
      - "/apps/backoffice"
      - "/apps/docs"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
    groups:
      # Non-majeurs seulement : un majeur d'image de base (`node:24` → `node:26`,
      # par ex.) part en PR individuelle, comme pour Cargo/npm.
      docker-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # -------------------------------------------- docker-compose (services)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
    groups:
      # Non-majeurs seulement : un majeur de service part en PR individuelle.
      compose-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]
