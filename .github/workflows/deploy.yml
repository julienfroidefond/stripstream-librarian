name: Build & Push

# Builds and pushes the Docker images on GitHub-hosted runners, then deploys
# them on the Mac mini through the self-hosted runner (job `deploy`).
#
# This replaces the former Gitea pipeline (.gitea/workflows/deploy.yml):
# GitHub is now the single deployment path.
#
# Versioning: whenever a push to `main` results in at least one image being
# built, the workflow bumps the workspace version itself (patch by default),
# commits `chore: bump version to X`, tags `vX`, and pushes both back to `main`.
# The images are then built and tagged under the new version. A manual run can
# ask for a `minor`/`major` bump, or `none` to rebuild the current version.
#
# The bump is pushed over SSH with a write deploy key that is a ruleset bypass
# actor (the "Protect main" ruleset otherwise requires a pull request). Because
# that push is a normal push event, the job skips commits whose message starts
# with `chore: bump version to` — which breaks the otherwise-infinite loop.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump applied before building (default: patch)"
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - none

env:
  REGISTRY: docker.io
  OWNER: julienfroidefond32
  PLATFORMS: linux/amd64

# Read-only GITHUB_TOKEN: the version bump is pushed over SSH with the
# ruleset-bypass deploy key (see the checkout step), not with this token.
permissions:
  contents: read

# Serialise runs so two pushes cannot race on the version number.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-push:
    # Skip the run triggered by the version-bump commit itself (pushed over SSH
    # by this workflow); otherwise it would bump again forever. head_commit is
    # absent on workflow_dispatch, so manual runs always proceed.
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: bump version to') }}"
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detect.outputs.api }}
      backoffice: ${{ steps.detect.outputs.backoffice }}
      docs: ${{ steps.detect.outputs.docs }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Keep the parent commit available for the changed-files detection below.
          fetch-depth: 2
          # The version bump below pushes directly to `main`, which the "Protect
          # main" ruleset otherwise blocks (pull request required). This write
          # deploy key is a ruleset bypass actor, so authenticated git pushes go
          # over SSH and are allowed.
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Detect changes
        id: detect
        run: |
          set -euo pipefail
          v=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "current=$v" >> "$GITHUB_OUTPUT"
          echo "Detected version: $v"

          # On a manual run, the first push, or a force-push there is no parent
          # commit — rebuild everything in that case.
          build_all=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || ! git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            build_all=true
          fi

          if [ "$build_all" = true ]; then
            changed="ALL FILES"
          else
            changed=$(git diff --name-only HEAD~1 HEAD)
          fi
          echo "Changed files:"
          echo "$changed"

          has() {
            [ "$build_all" = true ] && return 0
            echo "$changed" | grep -qE "$1"
          }

          if has "^(apps/api/|apps/indexer/|crates/|Cargo\.toml|Cargo\.lock|infra/migrations/)"; then
            build_api=true
          else
            build_api=false
          fi
          if has "^apps/backoffice/"; then
            changed_backoffice=true
          else
            changed_backoffice=false
          fi
          if [ "$build_all" = true ]; then
            build_backoffice=true
          else
            # Test/config-only changes run the backoffice checks but must not
            # rebuild the production image.
            bo_build=$(echo "$changed" | grep -E "^apps/backoffice/" \
              | grep -vE "(^apps/backoffice/tests/|\.test\.(ts|tsx)$|^apps/backoffice/playwright\.config\.|^apps/backoffice/vitest\.config\.|^apps/backoffice/eslint\.config\.)" \
              || true)
            if [ -n "$bo_build" ]; then build_backoffice=true; else build_backoffice=false; fi
          fi
          if has "^apps/docs/"; then
            build_docs=true
          else
            build_docs=false
          fi

          # Consumed by the later build steps through the step environment...
          {
            echo "BUILD_API=$build_api"
            echo "CHANGED_BACKOFFICE=$changed_backoffice"
            echo "BUILD_BACKOFFICE=$build_backoffice"
            echo "BUILD_DOCS=$build_docs"
          } >> "$GITHUB_ENV"

          # ...and by the `deploy` job through job outputs.
          {
            echo "api=$build_api"
            echo "backoffice=$build_backoffice"
            echo "docs=$build_docs"
          } >> "$GITHUB_OUTPUT"

          if [ "$build_api" = true ]; then echo "api → build"; fi
          if [ "$build_backoffice" = true ]; then echo "backoffice → build"; fi
          if [ "$build_docs" = true ]; then echo "docs → build"; fi

          if [ "$build_api" = true ] || [ "$build_backoffice" = true ] || [ "$build_docs" = true ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "No image to build — deploy will be skipped."
          fi

      # ── Automatic version bump ─────────────────────────────────────────
      # Runs before the images are built so the compiled crates (which embed
      # the version via env!("CARGO_PKG_VERSION")) and the Docker tags both
      # carry the new version. Also runs before `npm ci`, which requires
      # package.json and package-lock.json to stay in sync.
      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          # Ensure pushes use the SSH deploy key from the checkout (bypass actor),
          # not the https GITHUB_TOKEN URL.
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          current='${{ steps.detect.outputs.current }}'
          bump='${{ inputs.bump }}'
          [ -z "$bump" ] && bump=patch

          if [ '${{ steps.detect.outputs.any }}' != 'true' ] || [ "$bump" = 'none' ]; then
            echo "No version bump (any=${{ steps.detect.outputs.any }}, bump=$bump)"
            echo "VERSION=$current" >> "$GITHUB_ENV"
            echo "version=$current" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS='.' read -r major minor patch <<< "$current"
          case "$bump" in
            major) new="$((major + 1)).0.0" ;;
            minor) new="$major.$((minor + 1)).0" ;;
            *)     new="$major.$minor.$((patch + 1))" ;;
          esac

          # Re-runs of a workflow check out the original (pre-bump) commit, so
          # recompute the same `new`. If it was already released, don't bump or
          # commit again — just build under that version.
          if git ls-remote --exit-code --tags origin "v$new" >/dev/null 2>&1; then
            echo "Version $new is already tagged — skipping bump"
            echo "VERSION=$new" >> "$GITHUB_ENV"
            echo "version=$new" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Version: $current → $new ($bump)"

          sed -i "s/^version = \"$current\"/version = \"$new\"/" Cargo.toml
          sed -i "s/\"version\": \"$current\"/\"version\": \"$new\"/" apps/backoffice/package.json
          sed -i "s/\"version\": \"$current\"/\"version\": \"$new\"/g" apps/backoffice/package-lock.json

          # Keep Cargo.lock in step with the bumped workspace members.
          if command -v cargo >/dev/null 2>&1; then
            cargo update --workspace >/dev/null 2>&1 || true
          else
            echo "::warning::cargo not found — Cargo.lock not synced"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock apps/backoffice/package.json apps/backoffice/package-lock.json
          git commit -m "chore: bump version to $new"
          git tag "v$new"

          # Pushed over SSH via the bypass deploy key; the resulting push event
          # is skipped by the job-level `chore: bump version to` guard.
          git push origin HEAD:main \
            || echo "::warning::could not push the version bump to main (branch protection?)"
          git push origin "v$new" \
            || echo "::warning::could not push tag v$new"

          echo "VERSION=$new" >> "$GITHUB_ENV"
          echo "version=$new" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: env.CHANGED_BACKOFFICE == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/backoffice/package-lock.json

      - name: Backoffice checks
        if: env.CHANGED_BACKOFFICE == 'true'
        working-directory: apps/backoffice
        run: |
          set -e
          npm ci
          npx tsc --noEmit
          npm run lint
          npm run test:unit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # api and indexer share apps/api/Dockerfile via stage targets — the
      # heavy `builder` stage is compiled once for api, then reused from cache
      # when indexer builds (only its small final stage runs).
      - name: Build & push api
        if: env.BUILD_API == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: api
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-api:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-api:${{ env.VERSION }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-api:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-api:buildcache,mode=max

      - name: Build & push indexer
        if: env.BUILD_API == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: indexer
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-indexer:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-indexer:${{ env.VERSION }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-indexer:buildcache
            type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-api:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-indexer:buildcache,mode=max

      - name: Build & push backoffice
        if: env.BUILD_BACKOFFICE == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backoffice/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-backoffice:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-backoffice:${{ env.VERSION }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-backoffice:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-backoffice:buildcache,mode=max

      - name: Build & push docs
        if: env.BUILD_DOCS == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/docs/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-docs:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-docs:${{ env.VERSION }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-docs:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-docs:buildcache,mode=max

  # Runs on the Mac mini (self-hosted runner, OrbStack). Pulls the images that
  # were just pushed and restarts the stripstream stack from the local
  # docker-stack checkout. The images are public, so no registry login is
  # needed here.
  #
  # Guarded on the repository so a fork can never reach the self-hosted runner,
  # and only reachable from a push to main (the workflow has no pull_request
  # trigger).
  deploy:
    name: Deploy to Mac mini
    needs: build-and-push
    if: >-
      needs.build-and-push.outputs.any == 'true' &&
      github.repository == 'julienfroidefond/stripstream-librarian'
    runs-on: [self-hosted, mac-mini]
    steps:
      - name: Pull images & restart stack
        env:
          DEPLOY_API: ${{ needs.build-and-push.outputs.api }}
          DEPLOY_BACKOFFICE: ${{ needs.build-and-push.outputs.backoffice }}
          DEPLOY_DOCS: ${{ needs.build-and-push.outputs.docs }}
        run: |
          set -euo pipefail
          # OrbStack's docker CLI ignores DOCKER_CONFIG (and --config) and always
          # uses the macOS keychain credential helper declared in
          # ~/.docker/config.json, which is unreachable from the runner's
          # non-interactive launchd session. Every image deployed here is public,
          # so shadow the helper with a stub that reports "no credentials" and
          # let the pull run anonymously.
          #
          # The message MUST go to stdout: Docker's credential client treats the
          # stdout string "credentials not found in native keychain" as "no
          # credentials" and falls back to an anonymous pull. On stderr Docker
          # only sees an empty stdout + a non-zero exit and fails the pull with
          # "error getting credentials - err: exit status 1, out: ``".
          HELPER_DIR="$(mktemp -d)"
          printf '#!/bin/sh\ncase "$1" in\n  get) echo "credentials not found in native keychain"; exit 1 ;;\n  store) cat >/dev/null; exit 0 ;;\n  erase) exit 0 ;;\n  list) echo "{}"; exit 0 ;;\nesac\nexit 0\n' > "$HELPER_DIR/docker-credential-osxkeychain"
          chmod +x "$HELPER_DIR/docker-credential-osxkeychain"
          export PATH="$HELPER_DIR:$PATH"
          cd /Users/julienfroidefond/Sites/docker-stack

          svcs=""
          if [ "$DEPLOY_API" = "true" ]; then svcs="$svcs api indexer"; fi
          if [ "$DEPLOY_BACKOFFICE" = "true" ]; then svcs="$svcs backoffice"; fi
          if [ "$DEPLOY_DOCS" = "true" ]; then svcs="$svcs docs"; fi

          for svc in $svcs; do
            echo "Pulling julienfroidefond32/stripstream-$svc:latest"
            docker pull "julienfroidefond32/stripstream-$svc:latest"
          done

          BUILDKIT_PROGRESS=plain ./scripts/stack.sh up stripstream
