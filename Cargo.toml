[workspace]
members = [
  "apps/api",
  "apps/indexer",
  "crates/core",
  "crates/notifications",
  "crates/parsers",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "3.32.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.6"
axum = "0.7"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jpeg-decoder = "0.3"
lru = "0.18"
rayon = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "form", "query", "rustls", "webpki-roots"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.27", features = ["serde", "v4"] }
natord = "1.0"
num_cpus = "1.16"
pdfium-render = { version = "0.8", default-features = false, features = ["pdfium_latest", "image_latest", "thread_safe"] }
unrar = "0.5"
walkdir = "2.5"
webp = "0.3"
utoipa = "4.0"
utoipa-swagger-ui = "6.0"
scraper = "0.27"
grammers-client = "0.7"
grammers-session = "0.7"

[patch.crates-io]
core2 = { path = "crates/core2-shim" }
