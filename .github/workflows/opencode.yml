name: opencode

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# One run per issue/PR. A newer event supersedes the previous run instead of
# queueing behind it: without this, a single wedged run blocks every further
# `/oc` mention on that thread until the 6 h default job timeout.
#
# The agent posts "Created PR #N" itself when it finishes. That issue_comment
# event used to land in the same group and cancelled the run that had just
# opened the PR, in the middle of its post-steps: four green runs (PRs #131,
# #132, #133, #138) were reported as "cancelled" for this reason. Bot-triggered
# runs therefore get a throwaway group, so they can never cancel real work.
concurrency:
  group: >-
    opencode-${{ github.event.sender.type == 'Bot'
    && format('noop-{0}', github.run_id)
    || github.event.issue.number
    || github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Same wiring as ci.yml: `#[sqlx::test]` creates a throwaway database per
  # test, which needs the CREATEDB privilege (POSTGRES_USER is a superuser).
  DATABASE_URL: postgres://stripstream:stripstream@localhost:5432/stripstream
  # `external_directory` and `doom_loop` default to "ask". In a non-interactive
  # CI run nobody can answer, so a single out-of-workspace path hangs the agent
  # until the job timeout (observed on 2026-10-19: 53 min of silence at
  # `/home/runner/work/work/...`). Deny instead: the tool fails fast and the
  # agent recovers. /tmp stays writable for scratch files.
  OPENCODE_CONFIG_CONTENT: >-
    {"permission":{"external_directory":{"*":"deny","/tmp/**":"allow"},"doom_loop":"deny"}}

jobs:
  issue:
    name: Implement labeled issue
    if: |
      github.event_name == 'issues' &&
      github.event.label.name == 'ai' &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    # fmt + clippy + the full test suite on a cold cache takes ~20–30 min, then
    # the agent itself works 20–45 min (one run needed >60 min on 2026-10-20 and
    # was cut mid-session). Cap the job so a wedged agent fails fast instead of
    # holding the concurrency group for the 6 h default.
    timeout-minutes: 90
    permissions:
      id-token: write
      # Swatinem/rust-cache needs `actions: write` to SAVE its cache; without it
      # the cache is restored read-only ("cache save skipped") and every run
      # recompiles the whole workspace before the agent can validate anything.
      actions: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: stripstream
          POSTGRES_PASSWORD: stripstream
          POSTGRES_DB: stripstream
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stripstream"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history: diffs are taken against origin/main.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-all-crates: true
          # Both jobs run on `main`; dropping the job-id suffix lets the
          # `comment` job restore the cache saved by the `issue` job (and vice
          # versa) instead of recompiling from scratch.
          add-job-id-key: false

      # Same runner as ci.yml, so the agent validates with the exact command CI uses.
      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # pdfium-render binds libpdfium at runtime. Without it the PDF parser
      # tests are skipped, which is a false green for the agent.
      - name: Install libpdfium
        run: |
          curl -sSL "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz" -o /tmp/pdfium.tgz
          tar -xzf /tmp/pdfium.tgz -C /tmp
          sudo cp /tmp/lib/libpdfium.so /usr/local/lib/
          sudo ldconfig

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/deepseek-v4.1-flash
          variant: max
          prompt: |
            Implement the GitHub issue this event refers to.

            ## Before coding
            - Read the full issue, including all comments, and restate the acceptance
              criteria as a checklist.
            - Read AGENTS.md and the module-level AGENTS.md of every area you touch.
            - If the issue spans several independent surfaces, or would touch more than
              ~15 files, comment on the issue with a proposed split and stop.
            - Search for existing code first (`rg`, and `semble` if available): helpers,
              components, predicates, SQL queries. Reuse or extend them. Never copy-paste
              an existing SQL block, predicate or UI fragment; if duplication is
              unavoidable, justify it in the PR body.

            ## Implementation
            - Follow AGENTS.md: small cohesive modules, factor shared logic out, no dead
              code, no unrelated reformatting.
            - Update the docs in apps/docs/ when user-visible behavior changes.
            - Add tests for the nominal path, the empty/no-op path, the boundary rows
              that actually exist in the schema (for example `book_reading_progress`
              rows with status = 'unread'), and the error path. Name them in the PR body.

            ## Validation (must pass before opening the PR)
            - `cargo fmt --all -- --check`
            - `cargo clippy --workspace --all-targets -- -D warnings`
            - `cargo nextest run --workspace` (PostgreSQL and libpdfium are installed; if
              database tests cannot connect, report it instead of rewriting the tests).
            - If you touched a web app: `npm ci && npx next typegen && npx tsc --noEmit
              && npm run lint && npm run test:unit` in that app directory.
            - If a test fails for reasons unrelated to your change, name it and show that
              it also fails on the base commit.

            ## Self-review before opening the PR
            Stage everything (`git add -A`) so new files appear in the diff, then re-read
            `git diff origin/main` (the checkout has full history). Then delegate a second
            review to the `reviewer` subagent: give it the issue's acceptance criteria and
            the base ref (`origin/main`); it can read the diff itself. Ask for findings
            with `file:line`. Address every finding, or justify in the final response why
            it does not apply.
            Check the same axes yourself and fix what you find:
            - duplication: is there an existing helper, component, predicate or SQL query
              that should have been reused or factored out?
            - dead code: unused imports or variables, unreachable branches, debug output;
            - contracts: API structs, Client vs Admin OpenAPI, docs and TS DTOs agree,
              including path and parameter names;
            - completeness: every acceptance criterion has code and tests; every new i18n
              key exists in both en.ts and fr.ts;
            - scope: no unrelated changes, no version bump, no formatting noise.

            ## Pull request
            - Do not create a branch, commit, push or open the pull request yourself: the
              runner does that after you finish, and uses your final response as the PR
              body.
            - Make the final response the PR body, with these sections: Contexte,
              Changement, Réutilisation (existing code reused), Tests (names), Commandes
              exécutées, Points d'attention / hors périmètre.
            - Never push directly to `main`.
            - If the issue is ambiguous or requires a product decision, stop and explain
              the decision needed instead of guessing.

  comment:
    name: Reply to mention
    if: |
      github.event_name != 'issues' &&
      github.event.sender.type != 'Bot' &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      # Same as the `issue` job: required for the cargo cache to be saved.
      actions: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: stripstream
          POSTGRES_PASSWORD: stripstream
          POSTGRES_DB: stripstream
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stripstream"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history: diffs are taken against origin/main.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-all-crates: true
          # Both jobs run on `main`; dropping the job-id suffix lets the
          # `comment` job restore the cache saved by the `issue` job (and vice
          # versa) instead of recompiling from scratch.
          add-job-id-key: false

      # Same runner and validation commands as the `issue` job: `/oc` follows
      # the same prompt guidance, so nextest must be available here too.
      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Install libpdfium
        run: |
          curl -sSL "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz" -o /tmp/pdfium.tgz
          tar -xzf /tmp/pdfium.tgz -C /tmp
          sudo cp /tmp/lib/libpdfium.so /usr/local/lib/
          sudo ldconfig

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/deepseek-v4.1-flash
          variant: max
