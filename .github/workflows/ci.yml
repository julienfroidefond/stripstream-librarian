name: CI

# Rust quality gate: formatting, lints and the full test suite (including the
# `#[sqlx::test]` database tests, backed by the PostgreSQL service below).
#
# Single job on purpose: its name — `Rust (fmt · clippy · test)` — is the
# required status check on the protected branch, so it must stay stable.
#
# Tests run through cargo-nextest instead of `cargo test`: it executes each test
# in its own process and schedules them across all cores, which is markedly
# faster on this suite (~400 `#[sqlx::test]` cases). nextest does not run
# doctests; this workspace has none.
#
# It only triggers when Rust sources, the workspace manifests or the DB
# migrations change — a docs-only or backoffice-only PR does not spin up
# the (expensive, several-minute) Rust job.
#
# Pull requests only: the merge to `main` deliberately does NOT re-run this
# workflow (it used to duplicate the PR run on a fresh commit). The corollary is
# that `Rust (fmt · clippy · test)` MUST be configured as a required status
# check on the protected branch, otherwise a PR could be merged without ever
# being validated. Direct pushes to `main` bypass this gate entirely — use
# `workflow_dispatch` below or a PR in that case.

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/indexer/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "infra/migrations/**"
      - "rust-toolchain*"
  workflow_dispatch:

# A new push to the same pull request cancels the previous, still-running gate
# instead of letting two full runs finish concurrently.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Matches the service container below (host port, not the 6432 used by the
  # local Docker stack).
  DATABASE_URL: postgres://stripstream:stripstream@localhost:5432/stripstream

jobs:
  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: stripstream
          POSTGRES_PASSWORD: stripstream
          POSTGRES_DB: stripstream
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stripstream"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `#[sqlx::test]` creates a throwaway database per test, which needs the
      # CREATEDB privilege. POSTGRES_USER is a superuser, so it already has it.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Persist the cache even when a test fails, so a red run does not
          # throw away the (expensive) compilation for the next attempt.
          cache-on-failure: true
          # Also cache crates that are not direct workspace dependencies: the
          # test binaries pull in a lot of transitive dev-dependency code.
          cache-all-crates: true

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # nextest runs each test in its own process and schedules them across all
      # cores far better than `cargo test`. It does not run doctests, and this
      # workspace has none.
      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Test
        run: cargo nextest run --workspace
