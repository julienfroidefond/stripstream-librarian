name: Manual Build & Push

# Manual per-service build & push on GitHub-hosted runners, then deploy on the
# Mac mini through the self-hosted runner. Replaces the former Gitea manual
# pipeline (.gitea/workflows/manual-deploy.yml).

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build & push"
        required: true
        type: choice
        options:
          - api+indexer
          - backoffice
          - docs
          - all

env:
  REGISTRY: docker.io
  OWNER: julienfroidefond32
  PLATFORMS: linux/amd64

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        run: |
          set -euo pipefail
          v=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Version: $v"
          svc="${{ github.event.inputs.service }}"
          if [ "$svc" = "api+indexer" ] || [ "$svc" = "all" ]; then
            echo "BUILD_API=true" >> "$GITHUB_ENV"
          else
            echo "BUILD_API=false" >> "$GITHUB_ENV"
          fi
          if [ "$svc" = "backoffice" ] || [ "$svc" = "all" ]; then
            echo "BUILD_BACKOFFICE=true" >> "$GITHUB_ENV"
          else
            echo "BUILD_BACKOFFICE=false" >> "$GITHUB_ENV"
          fi
          if [ "$svc" = "docs" ] || [ "$svc" = "all" ]; then
            echo "BUILD_DOCS=true" >> "$GITHUB_ENV"
          else
            echo "BUILD_DOCS=false" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push api
        if: env.BUILD_API == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: api
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-api:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-api:${{ env.VERSION }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-api:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-api:buildcache,mode=max

      - name: Build & push indexer
        if: env.BUILD_API == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: indexer
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-indexer:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-indexer:${{ env.VERSION }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-indexer:buildcache
            type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-api:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-indexer:buildcache,mode=max

      - name: Build & push backoffice
        if: env.BUILD_BACKOFFICE == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backoffice/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-backoffice:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-backoffice:${{ env.VERSION }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-backoffice:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-backoffice:buildcache,mode=max

      - name: Build & push docs
        if: env.BUILD_DOCS == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docs/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-docs:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-docs:${{ env.VERSION }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-docs:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/stripstream-docs:buildcache,mode=max

  # Same self-hosted deploy as .github/workflows/deploy.yml, driven by the
  # manual `service` input instead of change detection.
  deploy:
    name: Deploy to Mac mini
    needs: build-and-push
    if: github.repository == 'julienfroidefond/stripstream-librarian'
    runs-on: [self-hosted, mac-mini]
    steps:
      - name: Pull images & restart stack
        run: |
          set -euo pipefail
          # OrbStack's docker CLI ignores DOCKER_CONFIG (and --config) and always
          # uses the macOS keychain credential helper declared in
          # ~/.docker/config.json, which is unreachable from the runner's
          # non-interactive launchd session. Every image deployed here is public,
          # so shadow the helper with a stub that reports "no credentials" and
          # let the pull run anonymously.
          HELPER_DIR="$(mktemp -d)"
          printf '#!/bin/sh\ncase "$1" in\n  get) echo "credentials not found in native keychain" >&2; exit 1 ;;\n  store) cat >/dev/null; exit 0 ;;\n  erase) exit 0 ;;\n  list) echo "{}"; exit 0 ;;\nesac\nexit 0\n' > "$HELPER_DIR/docker-credential-osxkeychain"
          chmod +x "$HELPER_DIR/docker-credential-osxkeychain"
          export PATH="$HELPER_DIR:$PATH"
          cd /Users/julienfroidefond/Sites/docker-stack

          svc="${{ github.event.inputs.service }}"
          case "$svc" in
            all) set -- api indexer backoffice docs ;;
            api+indexer) set -- api indexer ;;
            *) set -- "$svc" ;;
          esac

          for s in "$@"; do
            echo "Pulling julienfroidefond32/stripstream-$s:latest"
            docker pull "julienfroidefond32/stripstream-$s:latest"
          done

          BUILDKIT_PROGRESS=plain ./scripts/stack.sh up stripstream
