name: opencode

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# One run per issue/PR. A newer event supersedes the previous run instead of
# queueing behind it: without this, a single wedged run blocks every further
# `/oc` mention on that thread until the 6 h default job timeout.
concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Same wiring as ci.yml: `#[sqlx::test]` creates a throwaway database per
  # test, which needs the CREATEDB privilege (POSTGRES_USER is a superuser).
  DATABASE_URL: postgres://stripstream:stripstream@localhost:5432/stripstream
  # `external_directory` and `doom_loop` default to "ask". In a non-interactive
  # CI run nobody can answer, so a single out-of-workspace path hangs the agent
  # until the job timeout (observed on 2026-10-19: 53 min of silence at
  # `/home/runner/work/work/...`). Deny instead: the tool fails fast and the
  # agent recovers. /tmp stays writable for scratch files.
  OPENCODE_CONFIG_CONTENT: >-
    {"permission":{"external_directory":{"*":"deny","/tmp/**":"allow"},"doom_loop":"deny"}}

jobs:
  issue:
    name: Implement labeled issue
    if: |
      github.event_name == 'issues' &&
      github.event.label.name == 'ai' &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    # fmt + clippy + the full test suite on a cold cache takes ~20–30 min.
    # Cap the job so a wedged agent fails fast instead of holding the
    # concurrency group for the 6 h default.
    timeout-minutes: 60
    permissions:
      id-token: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: stripstream
          POSTGRES_PASSWORD: stripstream
          POSTGRES_DB: stripstream
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stripstream"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-all-crates: true

      # pdfium-render binds libpdfium at runtime. Without it the PDF parser
      # tests are skipped, which is a false green for the agent.
      - name: Install libpdfium
        run: |
          curl -sSL "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz" -o /tmp/pdfium.tgz
          tar -xzf /tmp/pdfium.tgz -C /tmp
          sudo cp /tmp/lib/libpdfium.so /usr/local/lib/
          sudo ldconfig

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/deepseek-v4.1-flash
          variant: max
          prompt: |
            Implement the GitHub issue this event refers to.

            - Read the full issue, including all comments, for context and acceptance criteria.
            - Follow the repository conventions in AGENTS.md.
            - Add or update tests for any behavior change.
            - The runner provisions PostgreSQL (`DATABASE_URL` is set) and libpdfium,
              so `cargo test --workspace` is expected to pass as-is. If database tests
              fail to connect, the infrastructure is broken — report it instead of
              rewriting the tests.
            - Run `cargo fmt -- --check`, `cargo clippy --workspace --all-targets`, and `cargo test --workspace` before finishing.
            - Create a dedicated branch and open a pull request that references the issue with `Closes #<number>`.
            - Never merge and never push directly to `main`.
            - If the issue is ambiguous or requires a product decision, comment on the issue with your questions instead of guessing.

  comment:
    name: Reply to mention
    if: |
      github.event_name != 'issues' &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: stripstream
          POSTGRES_PASSWORD: stripstream
          POSTGRES_DB: stripstream
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stripstream"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-all-crates: true

      - name: Install libpdfium
        run: |
          curl -sSL "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz" -o /tmp/pdfium.tgz
          tar -xzf /tmp/pdfium.tgz -C /tmp
          sudo cp /tmp/lib/libpdfium.so /usr/local/lib/
          sudo ldconfig

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/deepseek-v4.1-flash
          variant: max
